name: Wazu
options:
  bundleIdPrefix: com.starplayrx
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  WazKit:
    url: https://github.com/AgentiLoop/WazKit.git
    from: 1.0.0
targets:
  Wazu:
    type: application
    # One target, one scheme: pick My Mac or an iPhone in Xcode's destination menu.
    platform: auto
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Sources
        excludes: [Updater.swift, WazuApp.swift, Assets.xcassets, Info.plist]
      - path: Sources/WazuApp.swift
        destinationFilters: [macOS]
      - path: Sources/Updater.swift
        destinationFilters: [macOS]
      - path: Sources/Assets.xcassets
        destinationFilters: [macOS]
      - path: iOS
        excludes: [Info.plist]
        destinationFilters: [iOS]
    dependencies:
      - package: WazKit
    scheme:
      testTargets:
        - WazuTests
      environmentVariables:
        OS_ACTIVITY_MODE: disable
    settings:
      base:
        PRODUCT_NAME: Wazu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.starplayrx.wazu
        "PRODUCT_BUNDLE_IDENTIFIER[sdk=iphoneos*]": com.starplayrx.wazu.ios
        "PRODUCT_BUNDLE_IDENTIFIER[sdk=iphonesimulator*]": com.starplayrx.wazu.ios
        INFOPLIST_FILE: Sources/Info.plist
        "INFOPLIST_FILE[sdk=iphoneos*]": iOS/Info.plist
        "INFOPLIST_FILE[sdk=iphonesimulator*]": iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 469UCUB275
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
  WazuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Wazu
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 469UCUB275
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Wazu.app/Contents/MacOS/Wazu"
        BUNDLE_LOADER: "$(TEST_HOST)"
