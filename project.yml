name: Wazu
options:
  bundleIdPrefix: com.starplayrx
  deploymentTarget:
    macOS: "14.0"
packages:
  WazKit:
    url: https://github.com/AgentiLoop/WazKit.git
    from: 1.0.0
targets:
  Wazu:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: WazKit
    scheme:
      testTargets:
        - WazuTests
      environmentVariables:
        OS_ACTIVITY_MODE: disable
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Wazu
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        LSApplicationCategoryType: public.app-category.entertainment
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_NAME: Wazu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.starplayrx.wazu
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 469UCUB275
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
  WazuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Wazu
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 469UCUB275
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Wazu.app/Contents/MacOS/Wazu"
        BUNDLE_LOADER: "$(TEST_HOST)"
